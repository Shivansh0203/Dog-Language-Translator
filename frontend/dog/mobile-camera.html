<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>PawAI Mobile Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        body {
            position: relative;
            color: #fff;
        }

        #camera-preview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom))
                20px;
            pointer-events: none;
        }

        .bottom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            pointer-events: auto;
        }

        .bottom-controls button {
            pointer-events: auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            font-size: 13px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #aaa;
        }

        .status-dot.connected {
            background: #54c878;
        }

        .status-dot.recording {
            background: #ff4b4b;
        }

        .camera-message {
            align-self: center;
            max-width: 90%;
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            text-align: center;
            font-size: 14px;
        }

        .bottom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
        }

        .camera-btn {
            border: none;
            border-radius: 999px;
            min-width: 150px;
            min-height: 52px;
            padding: 0 22px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #start-recording-btn {
            background: #5f9f78;
            color: white;
        }

        #submit-btn {
            background: #b85c50;
            color: white;
        }

        #submit-btn:disabled,
        #start-recording-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #permission-screen {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 30px;
            text-align: center;
            background: #111;
        }

        #permission-screen.hidden {
            display: none;
        }

        .permission-title {
            font-size: 25px;
            font-weight: 700;
        }

        .permission-text {
            max-width: 360px;
            color: #ccc;
            line-height: 1.5;
        }

        #enable-camera-btn {
            border: none;
            border-radius: 999px;
            padding: 14px 24px;
            background: #fff;
            color: #111;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <video
        id="camera-preview"
        autoplay
        muted
        playsinline
    ></video>

    <div id="permission-screen">

        <div class="permission-title">
            PawAI Mobile Camera
        </div>

        <div class="permission-text">
            Allow camera and microphone access to use your phone
            as the PawAI camera.
        </div>

        <button id="enable-camera-btn">
            Enable Camera
        </button>

    </div>

    <div class="camera-overlay">

        <div class="top-bar">

            <div class="brand">
                PawAI
            </div>

            <div class="connection-status">

                <span
                    class="status-dot"
                    id="status-dot"
                ></span>

                <span id="connection-text">
                    Connecting...
                </span>

            </div>

        </div>

        <div
            class="camera-message"
            id="camera-message"
        >
            Connecting to your PawAI session...
        </div>

        <div class="bottom-controls">

            <button
                class="camera-btn"
                id="start-recording-btn"
                disabled
            >
                Start Recording
            </button>

            <button
                class="camera-btn"
                id="submit-btn"
                disabled
            >
                Submit
            </button>

        </div>

    </div>

    <script src="mobile-camera.js"></script>

</body>
</html>
