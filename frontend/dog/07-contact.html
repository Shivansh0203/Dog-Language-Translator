<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - PawAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap');
    :root {
      --ink: #332622;
      --deep: #181615;
      --paper: #f8f6f3;
      --warm: #dabf89;
      --peach: #edc3aa;
      --peach-deep: #a96849;
      --line: #d8c8bb;
      --muted: #6f625c;
      --light-muted: #877973;
      --text: var(--paper);
      --pink: var(--peach);
      --pink-soft: var(--peach-deep);
      --green: var(--warm);
      --shadow: 0 24px 70px rgba(24, 22, 21, .42);
      --pink-glow: 0 18px 42px rgba(169, 104, 73, .28);
      --font: "Open Sans", Arial, sans-serif;
      --heading-font: "Poppins", Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--heading-font);
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 30% 40%, #523a30 0, #302522 37%, #181817 73%);
      font-family: var(--font);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button, input, textarea {
      font: inherit;
    }
    button {
      border: 0;
      cursor: pointer;
    }
    .page {
      width: min(1140px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 28px;
    }
    .navbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 34px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .logo-image {
      width: 85px;
      height: 52px;
      object-fit: contain;
      display: block;
    }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--line);
      font-size: 12px;
      font-weight: 700;
      transition: color .2s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }
    .nav-link.active {
      color: var(--peach);
      position: relative;
    }
    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 2px;
      background: var(--peach);
      border-radius: 2px;
    }
    .nav-link i {
      font-size: 9px;
    }
    .nav-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .nav-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      color: #fff;
      background: var(--deep);
      font-size: 12px;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease;
    }
    .nav-contact:hover {
      transform: translateY(-1px);
      background: var(--peach-deep);
    }
    .utility-link {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      color: var(--light-muted);
      font-size: 16px;
      transition: color .2s ease, transform .2s ease;
    }
    .utility-link:hover {
      color: var(--text);
      transform: translateY(-1px);
    }
    .contact-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(390px, 500px);
      gap: 70px;
      align-items: center;
      padding: 62px;
      border-radius: 26px;
    }
    .intro {
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }
    h1 {
      max-width: 480px;
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 50px);
      line-height: .98;
      letter-spacing: -1.8px;
    }
    .intro > p {
      max-width: 430px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .contact-info {
      display: grid;
      gap: 18px;
      padding-top: 80px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 12px;
      font-weight: 700;
    }
    .info-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(237, 195, 170, .22);
      border-radius: 10px;
      color: var(--pink);
      background: rgba(237, 195, 170, .08);
    }
    .info-icon i {
      font-size: 13px;
    }
    .form-card {
      padding: 28px;
      border: 1px solid rgba(216, 200, 187, .65);
      border-radius: 20px;
      background: rgba(248, 246, 243, 0.044);
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
    }
    input, textarea {
      width: 100%;
      border: 1px solid rgba(216, 200, 187, .4);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: rgba(36, 30, 28, 0.72);
      font-size: 12px;
    }
    input {
      min-height: 42px;
      padding: 0 12px;
    }
    textarea {
      min-height: 120px;
      padding: 12px;
      resize: vertical;
    }
    input::placeholder, textarea::placeholder {
      color: #8d8179;
    }
    input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(237, 195, 170, .14);
    }
    .form-card .primary-btn {
      justify-self: start;
      min-height: 38px;
      border-radius: 10px;
      margin-top: 3px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 500;
      background: var(--peach-deep);
      color: #fff;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(169, 104, 73, 0.3);
    }
    .message {
      display: none;
      padding: 10px 12px;
      border: 1px solid rgba(218, 191, 137, .45);
      border-radius: 10px;
      color: var(--warm);
      background: rgba(218, 191, 137, .1);
      font-size: 11px;
      line-height: 1.4;
    }
    .message.show {
      display: block;
    }
    @media (max-width: 900px) {
      .nav-links {
        gap: 15px;
      }
      .nav-divider {
        margin: 0 11px;
      }
      .nav-actions {
        gap: 9px;
      }
    }
    @media (max-width: 800px) {
      .navbar {
        flex-wrap: wrap;
        row-gap: 12px;
      }
      .nav-links {
        order: 3;
        width: 100%;
      }
      .nav-actions {
        margin-left: auto;
      }
      .contact-card {
        grid-template-columns: 1fr;
        gap: 35px;
        padding: 32px;
      }
      .intro {
        min-height: auto;
      }
      .contact-info {
        margin-top: 35px;
      }
    }
    @media (max-width: 560px) {
      .page {
        width: min(100% - 24px, 680px);
        padding-top: 12px;
      }
      .navbar {
        margin-bottom: 20px;
      }
      .actions {
        gap: 6px;
      }
      .nav-links {
        gap: 11px;
        overflow-x: auto;
      }
      .nav-link {
        font-size: 11px;
      }
      .nav-actions .nav-contact, .nav-actions .utility-divider {
        display: none;
      }
      .nav-actions {
        gap: 6px;
      }
      .contact-card {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .form-card {
        padding: 18px;
      }
      h1 {
        font-size: 40px;
      }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="page">
    <header class="navbar">
      <!-- LEFT -->
      <a class="brand" href="home.html">
        <img src="../assets/web-logo-2.png" alt="PawAI logo" class="logo-image">
      </a>
      
      <!-- CENTER -->
      <nav class="nav-links">
        <a class="nav-link" href="home.html">Home</a>
        <a class="nav-link" href="chatbot.html">Pawbot</a>
        <a class="nav-link" href="08-help.html">Help</a>
        <a class="nav-link active" href="07-contact.html">Contact</a>
      </nav>
      
      <!-- RIGHT -->
      <div class="nav-actions">
        <a class="utility-link" href="#">
          <i class="fa-regular fa-bell"></i>
        </a>
        <a class="utility-link" href="05-settings.html">
          <i class="fa-solid fa-gear"></i>
        </a>
        <a class="utility-link" href="my-account.html">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </header>
    
    <main class="contact-card">
      <section class="intro">
        <div>
          <h1>Talk to our<br>support team</h1>
          <p>Feel free to reach out for help with your PawAI account or any questions you may have regarding our dog emotion and movement tracking system.</p>
        </div>
        
        <div class="contact-info">
          <div class="info-item">
            <span class="info-icon"><i class="fa-regular fa-envelope"></i></span>
            <span>support@pawai.com</span>
          </div>
          <div class="info-item">
            <span class="info-icon"><i class="fa-solid fa-location-dot"></i></span>
            <span>PawAI Support Center, India</span>
          </div>
          <div class="info-item">
            <span class="info-icon"><i class="fa-solid fa-phone"></i></span>
            <span>+91 00000 00000</span>
          </div>
        </div>
      </section>
      
      <section class="form-card">
        <form id="contactForm">
          <label>
            Full Name
            <input type="text" placeholder="Enter your full name" required>
          </label>
          <label>
            Email Address
            <input type="email" placeholder="Enter your email address" required>
          </label>
          <label>
            Phone Number
            <input type="tel" placeholder="Enter your phone number">
          </label>
          <label>
            Message
            <textarea placeholder="Write your message here" required></textarea>
          </label>
          <button class="primary-btn" type="submit">
            Send Message <i class="fa-solid fa-arrow-right" style="margin-left:8px"></i>
          </button>
          <div id="contactMessage" class="message" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>
  </div>
  
  <script src="theme.js"></script>
  <script>
    document.querySelector("#contactForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const message = document.querySelector("#contactMessage");
      message.textContent = "Message ready. Connect this form to your backend when available.";
      message.className = "message show";
    });
  </script>
</body>
</html>
