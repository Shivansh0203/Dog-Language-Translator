services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawai_user
      POSTGRES_PASSWORD: pawai_local_password_change_me
      POSTGRES_DB: pawai
    volumes:
      - pawai_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pawai_user:pawai_local_password_change_me@db:5432/pawai
      TEST_DATABASE_URL: postgresql+psycopg://pawai_user:pawai_local_password_change_me@db:5432/pawai
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:5501
      RATE_LIMIT_ENABLED: "true"
      ENVIRONMENT: development
    depends_on:
      - db
    command: >-
      sh -c "until python -c \"import psycopg; psycopg.connect('postgresql://pawai_user:pawai_local_password_change_me@db:5432/pawai').close()\"; do echo 'Waiting for PostgreSQL...'; sleep 2; done; alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pawai_db_data:
